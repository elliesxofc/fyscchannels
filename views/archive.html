<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Final results of FYSC Season 9: every channel's final subscriber count.">
  <title>Season 9 Archive | fysc.lilianax.lol</title>
  <link rel="icon" type="image/png" href="https://www.banner.yt/UC6SnTw5Tr3b6IoJhwNsQdvg/avatar" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --pink: #ff5fb0;
      --pink-soft: #ff9ecb;
      --pink-deep: #c239b3;
      --bg-0: #120311;
      --bg-1: #2b0a20;
      --bg-2: #4a0e33;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 143, 214, 0.18);
      --text: #ffe9f5;
      --text-dim: #d9a8c4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Poppins', 'Helvetica', sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, rgba(255, 95, 176, 0.18), transparent 45%),
                  radial-gradient(circle at 80% 75%, rgba(194, 57, 179, 0.22), transparent 50%),
                  linear-gradient(135deg, var(--bg-0), var(--bg-1), var(--bg-2), var(--bg-0));
      background-size: 200% 200%, 200% 200%, 400% 400%;
      animation: gradientShift 22s ease infinite;
      padding: 90px 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 0%, 100% 100%, 0% 50%; }
      50% { background-position: 100% 100%, 0% 0%, 100% 50%; }
      100% { background-position: 0% 0%, 100% 100%, 0% 50%; }
    }

    .back-link {
      position: fixed;
      top: 24px;
      left: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--pink-soft);
    }

    h1 {
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 700;
      margin: 0 0 6px;
      text-align: center;
    }

    h1 span {
      color: var(--pink);
    }

    .subtitle {
      margin: 0 0 28px;
      font-size: 14px;
      color: var(--text-dim);
      text-align: center;
    }

    .search-container {
      display: flex;
      width: 100%;
      max-width: 480px;
      margin: 0 auto 32px;
    }

    .search-bar {
      flex-grow: 1;
      padding: 13px 18px;
      border-radius: 999px 0 0 999px;
      border: 1px solid var(--card-border);
      border-right: none;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    .search-bar::placeholder {
      color: var(--text-dim);
    }

    .search-bar:focus {
      border-color: var(--pink);
    }

    .search-button {
      padding: 13px 22px;
      border-radius: 0 999px 999px 0;
      border: none;
      background: linear-gradient(90deg, var(--pink-deep), var(--pink));
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: filter 0.2s ease;
    }

    .search-button:hover {
      filter: brightness(1.1);
    }

    .compare-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: -16px auto 32px;
      padding: 9px 18px;
      border: 1.5px solid var(--pink-soft);
      border-radius: 999px;
      color: var(--pink-soft);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .compare-link:hover {
      background: var(--pink-soft);
      color: #1a0413;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 1400px;
    }

    .channel-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      backdrop-filter: blur(14px);
      padding: 16px 18px 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .channel-card:hover {
      transform: translateY(-3px);
      border-color: var(--pink-soft);
    }

    .position {
      display: inline-block;
      background: linear-gradient(90deg, var(--pink-deep), var(--pink));
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      color: #fff;
      background: linear-gradient(135deg, var(--pink-deep), var(--pink-soft));
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .loading {
      display: none;
      align-items: center;
      gap: 10px;
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 143, 214, 0.25);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .profile p {
      margin: 0;
      font-weight: 500;
      font-size: 16px;
      line-height: 1.3;
      word-break: break-word;
    }

    .subscribers {
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--text-dim);
    }

    .card-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ghost-button {
      background: transparent;
      color: var(--pink-soft);
      border: 1.5px solid var(--pink-soft);
      border-radius: 999px;
      padding: 9px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .ghost-button:hover {
      background: var(--pink-soft);
      color: #1a0413;
    }

    .empty-state {
      color: var(--text-dim);
      font-size: 14px;
      margin-top: 20px;
    }

    .ended-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .stats-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 0 0 32px;
    }

    .stat {
      min-width: 150px;
      padding: 14px 20px;
      border-radius: 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      text-align: center;
    }

    .stat-label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .stat-value {
      display: block;
      margin-top: 4px;
      font-size: 18px;
      font-weight: 700;
      word-break: break-word;
    }

    .section-title {
      width: 100%;
      max-width: 1400px;
      margin: 0 0 14px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .podium {
      margin-bottom: 36px;
    }

    .channel-card.place-1 { border-color: #ffd36b; }
    .channel-card.place-2 { border-color: #d7dbe6; }
    .channel-card.place-3 { border-color: #e7a36f; }

    .place-1 .position { background: linear-gradient(90deg, #d99a1e, #ffd36b); color: #2b1700; }
    .place-2 .position { background: linear-gradient(90deg, #9aa3b5, #e3e7f0); color: #1b1f29; }
    .place-3 .position { background: linear-gradient(90deg, #b5642f, #f0b080); color: #2a1305; }

    .handle {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--text-dim);
      word-break: break-all;
    }

    .final-subs {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .final-label {
      margin: 0 0 14px;
      font-size: 12px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <a class="back-link" href="https://lilianax.lol"><i class="fa-solid fa-arrow-left"></i> lilianax.lol</a>

  <p class="ended-badge"><i class="fa-solid fa-flag-checkered"></i> <span id="endedText">Season ended</span></p>
  <h1>FYSC <span>Season 9</span> Archive</h1>
  <p class="subtitle">The archived final subscriber counts, frozen when the season ended</p>

  <div class="stats-row" id="statsRow" style="display: none;">
    <div class="stat"><span class="stat-label">Channels</span><span class="stat-value" id="statChannels"></span></div>
    <div class="stat"><span class="stat-label">Total subscribers</span><span class="stat-value" id="statTotal"></span></div>
  </div>

  <p class="section-title" id="podiumTitle" style="display: none;">Top 3</p>
  <div class="grid podium" id="podiumGrid"></div>

  <p class="section-title" id="allTitle" style="display: none;">All channels</p>
  <div class="search-container">
    <input type="text" id="searchInput" class="search-bar" placeholder="Search by name, @handle or channel ID...">
    <button id="searchButton" class="search-button">Search</button>
  </div>

  <div class="loading" id="loading"><span class="spinner"></span> Loading the archive...</div>
  <div class="grid" id="channelGrid"></div>
  <p class="empty-state" id="emptyState" style="display: none;">No channels found.</p>

  <script>
    // A frozen snapshot, not the live feed: data/season9-final.json was
    // built from the server's final fakecounts_data.json when Season 9 ended,
    // keeping only public fields. Ranks are by final subscriber count.
    const ARCHIVE_URL = '/data/season9-final.json';

    let allChannels = [];

    function formatNumber(num) {
      return Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function initials(name) {
      return name.split(' ').filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase();
    }

    function createCard(channel) {
      const card = document.createElement('div');
      card.className = 'channel-card' + (channel.rank <= 3 ? ' place-' + channel.rank : '');

      const position = document.createElement('div');
      position.className = 'position';
      position.textContent = `#${channel.rank}`;

      const profile = document.createElement('div');
      profile.className = 'profile';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      if (channel.cimage) {
        const img = document.createElement('img');
        img.src = channel.cimage;
        img.alt = channel.cname;
        img.loading = 'lazy';
        img.onerror = () => { avatar.textContent = initials(channel.cname); };
        avatar.appendChild(img);
      } else {
        avatar.textContent = initials(channel.cname);
      }

      const nameBox = document.createElement('div');
      const name = document.createElement('p');
      name.textContent = channel.cname;
      nameBox.appendChild(name);
      if (channel.handle) {
        const handle = document.createElement('p');
        handle.className = 'handle';
        handle.textContent = channel.handle;
        nameBox.appendChild(handle);
      }

      profile.appendChild(avatar);
      profile.appendChild(nameBox);

      const subs = document.createElement('p');
      subs.className = 'final-subs';
      subs.textContent = formatNumber(channel.subscribers);

      const label = document.createElement('p');
      label.className = 'final-label';
      label.textContent = 'final subscribers';

      const buttons = document.createElement('div');
      buttons.className = 'card-buttons';
      const goToChannelButton = document.createElement('button');
      goToChannelButton.className = 'ghost-button';
      goToChannelButton.textContent = 'Go to Channel';
      goToChannelButton.onclick = () => {
        window.open(`https://youtube.com/channel/${encodeURIComponent(channel.cid)}`, '_blank');
      };
      buttons.appendChild(goToChannelButton);

      card.appendChild(position);
      card.appendChild(profile);
      card.appendChild(subs);
      card.appendChild(label);
      card.appendChild(buttons);
      return card;
    }

    function displayChannels(channels) {
      const grid = document.getElementById('channelGrid');
      const emptyState = document.getElementById('emptyState');
      grid.replaceChildren(...channels.map(createCard));
      emptyState.style.display = channels.length === 0 ? 'block' : 'none';
    }

    async function loadArchive() {
      const loading = document.getElementById('loading');
      const emptyState = document.getElementById('emptyState');
      loading.style.display = 'flex';

      try {
        const response = await fetch(ARCHIVE_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const archive = await response.json();
        if (!Array.isArray(archive.channels)) throw new Error('Unexpected archive shape');
        allChannels = archive.channels;

        if (archive.endedAt) {
          const ended = new Date(archive.endedAt);
          document.getElementById('endedText').textContent = 'Season ended ' +
            ended.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
        }

        const total = allChannels.reduce((sum, c) => sum + c.subscribers, 0);
        document.getElementById('statChannels').textContent = formatNumber(allChannels.length);
        document.getElementById('statTotal').textContent = formatNumber(total);
        document.getElementById('statsRow').style.display = 'flex';

        document.getElementById('podiumGrid').replaceChildren(...allChannels.slice(0, 3).map(createCard));
        document.getElementById('podiumTitle').style.display = 'block';
        document.getElementById('allTitle').style.display = 'block';
        displayChannels(allChannels);
      } catch (err) {
        console.error('Error loading archive:', err);
        emptyState.textContent = 'Failed to load the archive.';
        emptyState.style.display = 'block';
      } finally {
        loading.style.display = 'none';
      }
    }

    function searchChannels() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      displayChannels(allChannels.filter(channel =>
        channel.cname.toLowerCase().includes(query) ||
        (channel.handle || '').toLowerCase().includes(query) ||
        channel.cid.toLowerCase().includes(query)
      ));
    }

    document.getElementById('searchButton').addEventListener('click', searchChannels);
    document.getElementById('searchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchChannels();
    });

    loadArchive();
  </script>
</body>
</html>
