<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FYSC Channels is closed until the next season.">
  <title>FYSC Channels | fysc.lilianax.lol</title>
  <link rel="icon" type="image/png" href="https://www.banner.yt/UC6SnTw5Tr3b6IoJhwNsQdvg/avatar" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --pink: #ff5fb0;
      --pink-soft: #ff9ecb;
      --pink-deep: #c239b3;
      --bg-0: #120311;
      --bg-1: #2b0a20;
      --bg-2: #4a0e33;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 143, 214, 0.18);
      --text: #ffe9f5;
      --text-dim: #d9a8c4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 90px 16px 60px;
      font-family: 'Poppins', 'Helvetica', sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, rgba(255, 95, 176, 0.18), transparent 45%),
                  radial-gradient(circle at 80% 75%, rgba(194, 57, 179, 0.22), transparent 50%),
                  linear-gradient(135deg, var(--bg-0), var(--bg-1), var(--bg-2), var(--bg-0));
      background-size: 200% 200%, 200% 200%, 400% 400%;
      animation: gradientShift 22s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 0%, 100% 100%, 0% 50%; }
      50% { background-position: 100% 100%, 0% 0%, 100% 50%; }
      100% { background-position: 0% 0%, 100% 100%, 0% 50%; }
    }

    .back-link {
      position: fixed;
      top: 24px;
      left: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--pink-soft);
    }

    .card {
      width: min(520px, 100%);
      padding: 48px 32px 36px;
      border-radius: 28px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .closed-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      margin-bottom: 18px;
      border-radius: 50%;
      background: rgba(255, 95, 176, 0.15);
      color: var(--pink);
      font-size: 22px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 700;
      line-height: 1.3;
    }

    h1 span {
      color: var(--pink);
    }

    .message {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
    }

    .signature {
      margin: 8px 0 30px;
      font-size: 14px;
      color: var(--pink-soft);
      font-weight: 500;
    }

    .button-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .fancy-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 24px;
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      text-decoration: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #7b1fa2, var(--pink-soft));
      box-shadow: 0 8px 24px rgba(255, 95, 176, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .fancy-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 95, 176, 0.4);
      filter: brightness(1.08);
    }

    .button-archive {
      background: linear-gradient(90deg, #c98a12, var(--pink));
    }
  </style>
</head>
<body>
  <a class="back-link" href="https://lilianax.lol"><i class="fa-solid fa-arrow-left"></i> lilianax.lol</a>

  <div class="card">
    <div class="closed-icon"><i class="fa-solid fa-moon"></i></div>
    <h1><span>FYSC Channels</span> is now closed</h1>
    <p class="message">FYSC Channels is now closed for now, see you in the next season!</p>
    <p class="signature">— Liliana</p>

    <div class="button-list">
      <a href="https://tnstats.dev/season1/fyscchannels" class="fancy-button"><i class="fa-solid fa-list"></i> Season 1 Channels</a>
      <a href="/archive" class="fancy-button button-archive"><i class="fa-solid fa-flag-checkered"></i> Season 9 Final Results</a>
    </div>
  </div>
</body>
</html>
