<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Compare two FYSC Season 9 channels' live subscriber counts.">
  <title>Compare Channels | fysc.lilianax.lol</title>
  <link rel="icon" type="image/png" href="https://www.banner.yt/UC6SnTw5Tr3b6IoJhwNsQdvg/avatar" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=DM+Sans:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --pink: #ff5fb0;
      --pink-soft: #ff9ecb;
      --pink-deep: #c239b3;
      --bg-0: #120311;
      --bg-1: #2b0a20;
      --bg-2: #4a0e33;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 143, 214, 0.18);
      --text: #ffe9f5;
      --text-dim: #d9a8c4;
      --up: #4ee08a;
      --down: #ff6b6b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Poppins', 'Helvetica', sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, rgba(255, 95, 176, 0.18), transparent 45%),
                  radial-gradient(circle at 80% 75%, rgba(194, 57, 179, 0.22), transparent 50%),
                  linear-gradient(135deg, var(--bg-0), var(--bg-1), var(--bg-2), var(--bg-0));
      background-size: 200% 200%, 200% 200%, 400% 400%;
      animation: gradientShift 22s ease infinite;
      padding: 90px 16px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 0%, 100% 100%, 0% 50%; }
      50% { background-position: 100% 100%, 0% 0%, 100% 50%; }
      100% { background-position: 0% 0%, 100% 100%, 0% 50%; }
    }

    .back-link {
      position: fixed;
      top: 24px;
      left: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--pink-soft);
    }

    h1 {
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 700;
      margin: 0 0 6px;
      text-align: center;
    }

    h1 span {
      color: var(--pink);
    }

    .subtitle {
      margin: 0 0 28px;
      font-size: 14px;
      color: var(--text-dim);
      text-align: center;
    }

    .card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
    }

    /* ---------- pick view ---------- */
    .pick-form {
      max-width: 440px;
      padding: 28px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pick-form label {
      font-size: 14px;
      font-weight: 500;
      margin-top: 6px;
    }

    .pick-form input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    .pick-form input::placeholder {
      color: var(--text-dim);
    }

    .pick-form input:focus {
      border-color: var(--pink-soft);
    }

    .hint {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--text-dim);
    }

    .form-error {
      margin: 4px 0 0;
      min-height: 18px;
      font-size: 13px;
      color: var(--down);
    }

    .primary-button {
      margin-top: 6px;
      padding: 13px 24px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--pink-deep), var(--pink));
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.2s ease;
    }

    .primary-button:hover:not(:disabled) {
      filter: brightness(1.1);
    }

    .primary-button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    /* ---------- compare view ---------- */
    .compare-view {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 640px;
      gap: 14px;
    }

    .channels-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .channel-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      padding: 22px 14px 18px;
      text-align: center;
    }

    .channel-card.leading {
      border-color: var(--pink-soft);
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 24px;
      color: #fff;
      background: linear-gradient(135deg, var(--pink-deep), var(--pink-soft));
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .channel-name {
      margin: 12px 0 0;
      font-size: 15px;
      font-weight: 600;
      word-break: break-word;
    }

    .channel-count {
      margin: 8px 0 0;
      font-family: 'DM Sans', 'Poppins', sans-serif;
      font-size: clamp(18px, 5vw, 30px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .channel-growth {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--text-dim);
    }

    .up { color: var(--up); }
    .down { color: var(--down); }

    .gap-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 22px 18px;
      text-align: center;
    }

    .gap-label {
      margin: 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .gap-value {
      margin: 6px 0 0;
      font-family: 'DM Sans', 'Poppins', sans-serif;
      font-size: clamp(28px, 7vw, 44px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .gap-text {
      margin: 6px 0 0;
      font-size: 14px;
      word-break: break-word;
    }

    .gap-trend {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--text-dim);
    }

    .updated-at {
      margin: 0;
      font-size: 12px;
      color: var(--text-dim);
    }

    .ghost-button {
      background: transparent;
      color: var(--pink-soft);
      border: 1.5px solid var(--pink-soft);
      border-radius: 999px;
      padding: 9px 18px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .ghost-button:hover {
      background: var(--pink-soft);
      color: #1a0413;
    }
  </style>
</head>
<body>
  <a class="back-link" href="/"><i class="fa-solid fa-arrow-left"></i> Channels</a>

  <h1>Compare <span>Season 9</span> Channels</h1>
  <p class="subtitle">Put two channels side by side and watch the gap live</p>

  <!-- pick view -->
  <form class="card pick-form" id="pickForm" autocomplete="off">
    <label for="inputA">First channel</label>
    <input type="text" id="inputA" list="channelNames" placeholder="Enter username or channel ID" required>
    <label for="inputB">Second channel</label>
    <input type="text" id="inputB" list="channelNames" placeholder="Enter username or channel ID" required>
    <datalist id="channelNames"></datalist>
    <p class="hint">Type the exact username (capitals count) or paste the channel ID.</p>
    <p class="form-error" id="formError" role="alert"></p>
    <button type="submit" class="primary-button" id="confirmButton" disabled>Loading channels...</button>
  </form>

  <!-- compare view -->
  <div class="compare-view" id="compareView">
    <div class="channels-row">
      <div class="card channel-card" id="cardA">
        <div class="avatar" id="avatarA"></div>
        <p class="channel-name" id="nameA"></p>
        <p class="channel-count" id="countA">0</p>
        <p class="channel-growth" id="growthA"></p>
      </div>
      <div class="card channel-card" id="cardB">
        <div class="avatar" id="avatarB"></div>
        <p class="channel-name" id="nameB"></p>
        <p class="channel-count" id="countB">0</p>
        <p class="channel-growth" id="growthB"></p>
      </div>
    </div>

    <div class="card gap-card">
      <p class="gap-label">Difference</p>
      <p class="gap-value" id="gapValue" role="status">0</p>
      <p class="gap-text" id="gapText"></p>
      <p class="gap-trend" id="gapTrend"></p>
    </div>

    <p class="updated-at" id="updatedAt"></p>
    <button type="button" class="ghost-button" id="changeButton"><i class="fa-solid fa-arrow-left"></i> Compare other channels</button>
  </div>

  <script src="/config.js"></script>
  <script>
    // Fetched straight from fysca's public, keyless endpoint (see config.js).
    const DATA_ENDPOINT = window.FYSC_DATA_URL;
    const POLL_INTERVAL_MS = 4000;
    // Growth is estimated from samples within this trailing window, same as
    // the live subcount page.
    const RATE_WINDOW_MS = 2 * 60 * 1000;
    const DAY_MS = 24 * 60 * 60 * 1000;

    const pickForm = document.getElementById('pickForm');
    const inputA = document.getElementById('inputA');
    const inputB = document.getElementById('inputB');
    const channelNames = document.getElementById('channelNames');
    const formError = document.getElementById('formError');
    const confirmButton = document.getElementById('confirmButton');
    const compareView = document.getElementById('compareView');
    const gapValueEl = document.getElementById('gapValue');
    const gapTextEl = document.getElementById('gapText');
    const gapTrendEl = document.getElementById('gapTrend');
    const updatedAtEl = document.getElementById('updatedAt');

    const slots = ['A', 'B'].map(key => ({
      card: document.getElementById('card' + key),
      avatar: document.getElementById('avatar' + key),
      name: document.getElementById('name' + key),
      count: document.getElementById('count' + key),
      growth: document.getElementById('growth' + key),
    }));

    let allChannels = [];
    let selected = null;      // [cidA, cidB] while comparing
    let samples = [];         // {t, a, b, diff} samples, oldest first
    let pollTimer = null;

    function formatNumber(num) {
      return Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function formatSigned(num) {
      const rounded = Math.round(num);
      return (rounded < 0 ? '−' : '+') + formatNumber(Math.abs(rounded));
    }

    function initials(name) {
      return name.split(' ').filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase();
    }

    async function fetchChannels() {
      const response = await fetch(DATA_ENDPOINT);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      if (!Array.isArray(data)) throw new Error('Unexpected response shape');
      return data;
    }

    // Channel ID or exact (case-sensitive) username. Falls back to a
    // case-insensitive match only when that's unambiguous, so a small
    // capitalisation slip still works but never picks the wrong channel.
    function findChannel(query) {
      const q = query.trim();
      if (!q) return { error: 'Enter a username or channel ID.' };
      const byId = allChannels.find(c => c.cid === q);
      if (byId) return { channel: byId };
      const exact = allChannels.filter(c => c.cname === q);
      if (exact.length === 1) return { channel: exact[0] };
      if (exact.length > 1) return { error: `More than one channel is named "${q}". Use its channel ID instead.` };
      const loose = allChannels.filter(c => c.cname.toLowerCase() === q.toLowerCase());
      if (loose.length === 1) return { channel: loose[0] };
      if (loose.length > 1) return { error: `More than one channel matches "${q}". Check the capitals, or use the channel ID.` };
      return { error: `No channel found for "${q}".` };
    }

    function setAvatar(el, channel) {
      el.replaceChildren();
      if (channel.cimage) {
        const img = document.createElement('img');
        img.src = channel.cimage;
        img.alt = channel.cname;
        img.onerror = () => { el.textContent = initials(channel.cname); };
        el.appendChild(img);
      } else {
        el.textContent = initials(channel.cname);
      }
    }

    // Per-day change of samples[key] across the trailing window.
    function ratePerDay(key) {
      const now = Date.now();
      const windowed = samples.filter(s => now - s.t <= RATE_WINDOW_MS);
      const sample = windowed.length >= 2 ? windowed : samples;
      if (sample.length < 2) return null;
      const first = sample[0];
      const last = sample[sample.length - 1];
      const dt = last.t - first.t;
      if (dt <= 0) return null;
      return ((last[key] - first[key]) / dt) * DAY_MS;
    }

    function renderGrowth(el, perDay) {
      el.classList.remove('up', 'down');
      if (perDay === null) {
        el.textContent = 'Measuring growth...';
        return;
      }
      el.textContent = formatSigned(perDay) + ' / day';
      el.classList.add(perDay < 0 ? 'down' : 'up');
    }

    function render(a, b) {
      [a, b].forEach((channel, i) => {
        slots[i].name.textContent = channel.cname;
        slots[i].count.textContent = formatNumber(channel.subscriberCountRealAPI);
      });

      const diff = a.subscriberCountRealAPI - b.subscriberCountRealAPI;
      const leaderIndex = diff > 0 ? 0 : diff < 0 ? 1 : -1;
      slots[0].card.classList.toggle('leading', leaderIndex === 0);
      slots[1].card.classList.toggle('leading', leaderIndex === 1);
      gapValueEl.textContent = formatNumber(Math.abs(diff));
      gapTextEl.textContent = leaderIndex === -1
        ? "They're tied!"
        : `${(leaderIndex === 0 ? a : b).cname} is ahead`;

      renderGrowth(slots[0].growth, ratePerDay('a'));
      renderGrowth(slots[1].growth, ratePerDay('b'));

      // How fast the gap itself is moving, from the leader's point of view.
      const gapRate = ratePerDay('diff');
      if (gapRate === null || leaderIndex === -1) {
        gapTrendEl.textContent = '';
      } else {
        const towardsLeader = leaderIndex === 0 ? gapRate : -gapRate;
        const trailer = (leaderIndex === 0 ? b : a).cname;
        gapTrendEl.textContent = Math.round(towardsLeader) >= 0
          ? `Gap growing by ${formatNumber(Math.abs(towardsLeader))} / day`
          : `${trailer} is catching up by ${formatNumber(Math.abs(towardsLeader))} / day`;
      }

      updatedAtEl.textContent = `Last updated ${new Date().toLocaleTimeString()}`;
    }

    async function poll() {
      if (!selected) return;
      try {
        allChannels = await fetchChannels();
        const a = allChannels.find(c => c.cid === selected[0]);
        const b = allChannels.find(c => c.cid === selected[1]);
        if (!a || !b) {
          updatedAtEl.textContent = 'One of these channels is no longer in the live data.';
          return;
        }
        const now = Date.now();
        samples.push({
          t: now,
          a: a.subscriberCountRealAPI,
          b: b.subscriberCountRealAPI,
          diff: a.subscriberCountRealAPI - b.subscriberCountRealAPI,
        });
        samples = samples.filter(s => now - s.t <= RATE_WINDOW_MS + 60 * 1000);
        render(a, b);
      } catch (err) {
        console.error('Error fetching live counts:', err);
        updatedAtEl.textContent = "Couldn't reach the server — retrying...";
      }
    }

    function startCompare(a, b) {
      selected = [a.cid, b.cid];
      samples = [];
      setAvatar(slots[0].avatar, a);
      setAvatar(slots[1].avatar, b);
      pickForm.style.display = 'none';
      compareView.style.display = 'flex';
      // Shareable link: /compare?a=<cid>&b=<cid> opens straight to this view.
      window.history.replaceState(null, '', `?a=${encodeURIComponent(a.cid)}&b=${encodeURIComponent(b.cid)}`);
      clearInterval(pollTimer);
      poll();
      pollTimer = setInterval(poll, POLL_INTERVAL_MS);
    }

    function showPicker() {
      selected = null;
      clearInterval(pollTimer);
      compareView.style.display = 'none';
      pickForm.style.display = 'flex';
      window.history.replaceState(null, '', location.pathname);
    }

    pickForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const first = findChannel(inputA.value);
      if (first.error) { formError.textContent = 'First channel: ' + first.error; return; }
      const second = findChannel(inputB.value);
      if (second.error) { formError.textContent = 'Second channel: ' + second.error; return; }
      if (first.channel.cid === second.channel.cid) {
        formError.textContent = 'Pick two different channels.';
        return;
      }
      formError.textContent = '';
      startCompare(first.channel, second.channel);
    });

    document.getElementById('changeButton').addEventListener('click', showPicker);

    async function init() {
      try {
        allChannels = await fetchChannels();
      } catch (err) {
        console.error('Error fetching channels:', err);
        confirmButton.textContent = 'Confirm';
        formError.textContent = "Couldn't load the channel list. Refresh to try again.";
        return;
      }

      const uniqueNames = [...new Set(allChannels.map(c => c.cname))].sort((x, y) => x.localeCompare(y));
      channelNames.replaceChildren(...uniqueNames.map(name => {
        const option = document.createElement('option');
        option.value = name;
        return option;
      }));
      confirmButton.disabled = false;
      confirmButton.textContent = 'Confirm';

      const params = new URLSearchParams(location.search);
      const a = allChannels.find(c => c.cid === params.get('a'));
      const b = allChannels.find(c => c.cid === params.get('b'));
      if (a && b && a.cid !== b.cid) {
        inputA.value = a.cname;
        inputB.value = b.cname;
        startCompare(a, b);
      }
    }

    init();
  </script>
</body>
</html>
